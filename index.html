<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChessHub – Play Chess Online</title>
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#262421;--panel:#312e2b;--panel2:#272522;--g:#81b64c;--g2:#6a9a3a;--l:#ebecd0;--d:#779556;--t:#bababa;--s:min(94vw,calc(100vh - 150px),680px)}
body{background:var(--bg);color:#fff;font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.hide{display:none!important}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);border-radius:12px;padding:28px;width:100%;max-width:400px;box-shadow:0 8px 30px #0006;display:flex;flex-direction:column;gap:12px}
.logo{font-size:30px;font-weight:800;text-align:center;letter-spacing:-.5px}.logo span{color:var(--g)}
h2{font-size:20px}
input,select{background:var(--panel2);border:2px solid #3d3a37;color:#fff;border-radius:8px;padding:12px 14px;font-size:16px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--g)}
.btn{background:#454240;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.15)}
.btn.big{background:var(--g);box-shadow:0 4px 0 var(--g2);padding:15px;font-size:19px}
.btn.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--g2)}
.btn.red{background:#a33}
.tabs{display:flex;background:var(--panel2);border-radius:8px;padding:4px}
.tabs button{flex:1;background:none;border:0;color:var(--t);padding:10px;font-weight:700;border-radius:6px;cursor:pointer;font-size:15px}
.tabs button.on{background:#454240;color:#fff}
.err{color:#ff6b6b;min-height:20px;text-align:center;font-size:14px}
.row{display:flex;gap:8px}
/* top bar */
.top{position:fixed;top:0;left:0;right:0;height:52px;background:var(--panel2);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:5;box-shadow:0 2px 10px #0005}
.top b{font-size:20px}.top b span{color:var(--g)}
.top .u{color:var(--t)}.top .u strong{color:#fff}
.lob{padding-top:70px;align-items:flex-start}
#lmsg{color:var(--t);text-align:center;min-height:22px}
/* game */
.gwrap{display:flex;gap:22px;align-items:flex-start;justify-content:center;flex-wrap:wrap;width:100%}
.bcol{width:var(--s)}
.bar{display:flex;align-items:center;justify-content:space-between;height:44px;gap:10px}
.who{display:flex;align-items:center;gap:10px;font-weight:700;min-width:0}
.av{width:34px;height:34px;border-radius:6px;background:#555;display:grid;place-items:center;font-size:20px;flex:none}
.who small{color:var(--t);font-weight:400}
.clock{background:#262421;font:700 22px/1 ui-monospace,Consolas,monospace;padding:8px 12px;border-radius:6px;color:#aaa;min-width:88px;text-align:center}
.clock.act{background:#fff;color:#222}.clock.low{background:#b33;color:#fff}
#board{display:grid;grid-template-columns:repeat(8,1fr);width:var(--s);height:var(--s);border-radius:5px;overflow:hidden;user-select:none;box-shadow:0 6px 24px #0007}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sq.l{background:var(--l)}.sq.d{background:var(--d)}
.sq img{position:relative;z-index:2;width:100%;height:100%;cursor:grab;-webkit-user-drag:element}
.sq.last::before,.sq.sel::before{content:"";position:absolute;inset:0;background:#f5f55f88;z-index:1}
.sq.sel::before{background:#ffff0077}
.chk::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#f00c 0,#e7000000 70%);z-index:1}
.dot{position:absolute;width:30%;height:30%;border-radius:50%;background:#0000002e;z-index:3;pointer-events:none}
.ring{position:absolute;inset:0;background:radial-gradient(transparent 60%,#0000002e 62%);z-index:3;pointer-events:none}
.rk,.fl{position:absolute;z-index:1;font:700 clamp(9px,1.7vw,13px) sans-serif;font-style:normal;pointer-events:none}
.rk{top:2px;left:3px}.fl{bottom:1px;right:4px}
.l .rk,.l .fl{color:var(--d)}.d .rk,.d .fl{color:var(--l)}
.side{width:320px;max-width:94vw;background:var(--panel);border-radius:10px;display:flex;flex-direction:column;height:var(--s);margin-top:44px;overflow:hidden}
.stat{padding:14px 16px;font-weight:700;font-size:17px;background:var(--panel2);text-align:center}
#moves{flex:1;overflow:auto;padding:8px 6px;display:grid;grid-template-columns:36px 1fr 1fr;align-content:start;font-size:15px}
#moves span{padding:4px 8px;border-radius:4px}#moves .n{color:var(--t)}#moves .cur{background:#454240;font-weight:700}
.acts{display:flex;gap:8px;padding:10px}.acts .btn{flex:1;padding:11px 6px;font-size:15px}
/* modal */
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20}
#modal .card{max-width:340px;text-align:center;align-items:stretch}
#modal h2{font-size:26px}
.promo{display:flex;justify-content:center;gap:6px}.promo img{width:68px;height:68px;background:#454240;border-radius:8px;cursor:pointer}.promo img:hover{background:var(--g)}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:#111;color:#fff;padding:12px 20px;border-radius:8px;transition:.3s;z-index:30;opacity:0}
#toast.on{transform:translate(-50%,0);opacity:1}
#conn{position:fixed;top:0;left:0;right:0;background:#c9a227;color:#000;text-align:center;font-weight:700;padding:6px;z-index:40}
</style>
</head>
<body>
<div id="conn">Connecting to server…</div>

<!-- LOGIN / SIGNUP -->
<div id="auth" class="screen"><div class="card">
  <div class="logo">♞ Chess<span>Hub</span></div>
  <div class="tabs"><button id="tl" class="on">Log In</button><button id="ts">Sign Up</button></div>
  <input id="u" placeholder="Username" autocomplete="username" maxlength="16">
  <input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <input id="p2" type="password" placeholder="Confirm password" class="hide">
  <button class="btn big" id="go">Log In</button>
  <div class="err" id="aerr"></div>
</div></div>

<!-- LOBBY -->
<div id="lobby" class="screen lob hide">
  <div class="top"><b>♞ Chess<span>Hub</span></b><div class="u"><strong id="uname"></strong> · <span id="urate"></span> <button class="btn" id="lo" style="padding:6px 12px;margin-left:10px;font-size:13px">Log out</button></div></div>
  <div class="card">
    <h2>Play Chess</h2>
    <select id="tc">
      <option value="60,0">Bullet · 1 min</option>
      <option value="180,2">Blitz · 3 | 2</option>
      <option value="300,0" selected>Blitz · 5 min</option>
      <option value="600,0">Rapid · 10 min</option>
      <option value="900,10">Rapid · 15 | 10</option>
    </select>
    <button class="btn big" id="bq">Play Online</button>
    <button class="btn" id="bc">Create private game</button>
    <div class="row"><input id="code" placeholder="Room code" maxlength="5" style="text-transform:uppercase"><button class="btn" id="bj">Join</button></div>
    <div id="lmsg"></div>
    <button class="btn red hide" id="bx">Cancel</button>
  </div>
</div>

<!-- GAME -->
<div id="game" class="screen hide"><div class="gwrap">
  <div class="bcol">
    <div class="bar"><div class="who"><div class="av">♟</div><div id="nt"></div></div><div class="clock" id="ct">--:--</div></div>
    <div id="board"></div>
    <div class="bar"><div class="who"><div class="av" style="background:var(--g)">♙</div><div id="nb"></div></div><div class="clock" id="cb">--:--</div></div>
  </div>
  <div class="side">
    <div class="stat" id="stat"></div>
    <div id="moves"></div>
    <div class="acts"><button class="btn" id="bd">½ Draw</button><button class="btn red" id="br">⚑ Resign</button></div>
  </div>
</div></div>

<div id="modal" class="hide"><div class="card" id="mc"></div></div>
<div id="toast"></div>

<script src="chess.js"></script>
<script>
/* ======== CONFIG ======== */
const WS_URL = 'wss://YOUR-DOMAIN-OR-VDS';   // <-- change this (must be wss:// for GitHub Pages)
const PIECES = '';                            // folder of piece images, e.g. 'img/' ('' = same folder)
/* ======================== */
const C = Chess, $ = id => document.getElementById(id);
let ws, me = null, G = null, mode = 'login', waiting = false;
const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
const show = id => ['auth', 'lobby', 'game'].forEach(x => $(x).classList.toggle('hide', x !== id));
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 3200); }

/* ---------- connection ---------- */
function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { $('conn').classList.add('hide'); const t = localStorage.getItem('ctoken'); if (t) send({ t: 'token', token: t }); };
  ws.onclose = () => { $('conn').classList.remove('hide'); setTimeout(connect, 2000); };
  ws.onmessage = e => onMsg(JSON.parse(e.data));
}
function onMsg(m) {
  switch (m.t) {
    case 'auth': me = m; localStorage.setItem('ctoken', m.token); $('uname').textContent = m.u; $('urate').textContent = '★ ' + m.rating; if (!G) show('lobby'); break;
    case 'noauth': localStorage.removeItem('ctoken'); me = null; G = null; show('auth'); break;
    case 'err': if (!me) $('aerr').textContent = m.m; else { toast(m.m); setWait(false); } break;
    case 'info': toast(m.m); break;
    case 'queued': setWait(true, 'Searching for an opponent…'); break;
    case 'room': setWait(true, 'Share this code with your friend: ' + m.code); break;
    case 'game': startGame(m); break;
    case 'move': if (G) { applyWire(m.m); G.clock = m.clock; G.t0 = Date.now(); render(); } break;
    case 'draw': toast('Opponent offers a draw – press ½ Draw to accept'); break;
    case 'over': endGame(m); break;
  }
}
function setWait(on, txt) { waiting = on; $('lmsg').textContent = on ? txt : ''; $('bx').classList.toggle('hide', !on); }

/* ---------- auth UI ---------- */
function setMode(m) { mode = m; $('tl').classList.toggle('on', m === 'login'); $('ts').classList.toggle('on', m === 'signup'); $('p2').classList.toggle('hide', m === 'login'); $('go').textContent = m === 'login' ? 'Log In' : 'Create Account'; $('aerr').textContent = ''; }
$('tl').onclick = () => setMode('login'); $('ts').onclick = () => setMode('signup');
$('go').onclick = () => {
  const u = $('u').value.trim(), p = $('p').value;
  if (!u || !p) return $('aerr').textContent = 'Fill in all fields';
  if (mode === 'signup' && p !== $('p2').value) return $('aerr').textContent = 'Passwords do not match';
  $('aerr').textContent = ''; send({ t: mode, u, p });
};
['u', 'p', 'p2'].forEach(i => $(i).addEventListener('keydown', e => e.key === 'Enter' && $('go').click()));
$('lo').onclick = () => { send({ t: 'logout' }); localStorage.removeItem('ctoken'); me = null; show('auth'); };

/* ---------- lobby UI ---------- */
$('bq').onclick = () => send({ t: 'queue', tc: $('tc').value.split(',').map(Number) });
$('bc').onclick = () => send({ t: 'create', tc: $('tc').value.split(',').map(Number) });
$('bj').onclick = () => send({ t: 'join', code: $('code').value });
$('bx').onclick = () => { send({ t: 'cancel' }); setWait(false); };

/* ---------- game ---------- */
function applyWire(w) {
  const m = C.find(G.st, w); if (!m) return;
  G.san.push(C.san(G.st, m)); G.st = C.apply(G.st, m); G.last = m; G.sel = null; G.legal = C.legal(G.st);
}
function startGame(m) {
  setWait(false);
  G = { id: m.id, color: m.color, w: m.white, b: m.black, st: C.init(), san: [], last: null, sel: null, over: false };
  G.legal = C.legal(G.st);
  m.moves.forEach(applyWire);
  G.clock = m.clock; G.t0 = Date.now();
  $('modal').classList.add('hide'); show('game'); render();
}
function endGame(m) {
  if (!G) return; G.over = true;
  const r = m.result, mine = G.color === 'w' ? '1-0' : '0-1';
  const title = r === '1/2-1/2' ? 'Draw' : r === mine ? 'You Won! 🏆' : 'You Lost';
  const old = me.rating; me.rating = m.ratings[G.color]; $('urate').textContent = '★ ' + me.rating;
  const d = me.rating - old;
  $('mc').innerHTML = `<h2>${title}</h2><div style="color:var(--t)">by ${m.reason}</div><div style="font-size:18px">Rating ${me.rating} <b style="color:${d >= 0 ? 'var(--g)' : '#ff6b6b'}">(${d >= 0 ? '+' : ''}${d})</b></div><button class="btn big" id="mb">Back to lobby</button><button class="btn" id="mv">View board</button>`;
  $('modal').classList.remove('hide');
  $('mb').onclick = () => { $('modal').classList.add('hide'); G = null; show('lobby'); };
  $('mv').onclick = () => { $('modal').classList.add('hide'); $('stat').innerHTML = 'Game over <button class="btn" id="mb2" style="padding:4px 10px;margin-left:8px">Lobby</button>'; $('mb2').onclick = $('mb').onclick; };
  render();
}
function render() {
  const s = G.st, flip = G.color === 'b', top = flip ? 'w' : 'b', bot = G.color;
  const P = c => G[c], nm = c => `${P(c).u} <small>(${P(c).r})</small>`;
  $('nt').innerHTML = nm(top); $('nb').innerHTML = nm(bot);
  const kp = C.inCheck(s) ? C.kingPos(s.b, s.turn) : null;
  const tgt = G.sel ? G.legal.filter(m => m.fr === G.sel[0] && m.fc === G.sel[1]) : [];
  let h = '';
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
    const r = flip ? 7 - i : i, c = flip ? 7 - j : j, p = s.b[r][c];
    let cl = 'sq ' + ((r + c) % 2 ? 'd' : 'l');
    if (G.last && ((G.last.fr === r && G.last.fc === c) || (G.last.tr === r && G.last.tc === c))) cl += ' last';
    if (G.sel && G.sel[0] === r && G.sel[1] === c) cl += ' sel';
    if (kp && kp[0] === r && kp[1] === c) cl += ' chk';
    const t = tgt.some(m => m.tr === r && m.tc === c);
    h += `<div class="${cl}" data-r="${r}" data-c="${c}">` + (j === 0 ? `<i class="rk">${8 - r}</i>` : '') + (i === 7 ? `<i class="fl">${'abcdefgh'[c]}</i>` : '') +
      (t ? `<b class="${p ? 'ring' : 'dot'}"></b>` : '') + (p ? `<img src="${PIECES}${p}.png" alt="${p}" draggable="${!G.over && p[0] === G.color}">` : '') + '</div>';
  }
  $('board').innerHTML = h;
  let mh = '';
  G.san.forEach((x, i) => { if (i % 2 === 0) mh += `<span class="n">${i / 2 + 1}.</span>`; mh += `<span class="${i === G.san.length - 1 ? 'cur' : ''}">${x}</span>`; });
  $('moves').innerHTML = mh; $('moves').scrollTop = 1e6;
  if (!G.over) $('stat').textContent = s.turn === G.color ? (kp ? 'Your move – check!' : 'Your move') : "Opponent's move";
  clocks();
}
const fmt = ms => { ms = Math.max(0, ms); const s = Math.ceil(ms / 1000); return ms < 10000 && ms > 0 ? (ms / 1000).toFixed(1) : String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function clocks() {
  if (!G) return;
  for (const x of ['w', 'b']) {
    const run = !G.over && G.st.turn === x, t = G.clock[x] - (run ? Date.now() - G.t0 : 0);
    const e = $(x === G.color ? 'cb' : 'ct'); e.textContent = fmt(t);
    e.className = 'clock' + (run ? ' act' : '') + (run && t < 20000 ? ' low' : '');
  }
}
setInterval(clocks, 100);

/* ---------- input: click + drag ---------- */
const mayMove = () => G && !G.over && G.st.turn === G.color;
function tryTo(r, c) {
  const ms = G.legal.filter(m => m.fr === G.sel[0] && m.fc === G.sel[1] && m.tr === r && m.tc === c);
  if (!ms.length) return false;
  if (ms.length > 1) promo(ms); else doMove(ms[0]);
  return true;
}
function doMove(m) { send({ t: 'move', m: C.wire(m) }); G.sel = null; $('modal').classList.add('hide'); render(); }
function promo(ms) {
  $('mc').innerHTML = `<h2>Promote to</h2><div class="promo">${'qrbn'.split('').map(q => `<img data-q="${q}" src="${PIECES}${G.color}${q}.png">`).join('')}</div>`;
  $('modal').classList.remove('hide');
  $('mc').querySelectorAll('img').forEach(i => i.onclick = () => doMove(ms.find(m => m.pr === i.dataset.q)));
}
$('board').addEventListener('click', e => {
  if (!mayMove()) return;
  const el = e.target.closest('.sq'); if (!el) return;
  const r = +el.dataset.r, c = +el.dataset.c, p = G.st.b[r][c];
  if (G.sel && tryTo(r, c)) return;
  G.sel = (p && p[0] === G.color && !(G.sel && G.sel[0] === r && G.sel[1] === c)) ? [r, c] : null; render();
});
$('board').addEventListener('dragstart', e => {
  const el = e.target.closest('.sq');
  if (!mayMove() || !el) return e.preventDefault();
  const r = +el.dataset.r, c = +el.dataset.c;
  if (G.st.b[r][c][0] !== G.color) return e.preventDefault();
  G.sel = [r, c]; e.dataTransfer.setData('text', 'x'); e.dataTransfer.effectAllowed = 'move';
});
$('board').addEventListener('dragover', e => e.preventDefault());
$('board').addEventListener('drop', e => {
  e.preventDefault(); const el = e.target.closest('.sq');
  if (!el || !G.sel) return;
  if (!tryTo(+el.dataset.r, +el.dataset.c)) render();
});
$('br').onclick = () => G && !G.over && confirm('Resign this game?') && send({ t: 'resign' });
$('bd').onclick = () => G && !G.over && send({ t: 'draw' });

connect();
</script>
</body>
</html>
