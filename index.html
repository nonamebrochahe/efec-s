<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Efeciiis – Play Chess Online</title>
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#262421;--panel:#312e2b;--panel2:#272522;--g:#81b64c;--g2:#6a9a3a;--l:#ebecd0;--d:#779556;--t:#bababa;--s:min(96vw,calc(100dvh - 140px),680px)}
body{background:var(--bg);color:#fff;font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.hide{display:none!important}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);border-radius:12px;padding:28px;width:100%;max-width:400px;box-shadow:0 8px 30px #0006;display:flex;flex-direction:column;gap:12px}
.logo{font-size:38px;font-weight:800;text-align:center;letter-spacing:-.5px}
h2{font-size:20px}
input,select{background:var(--panel2);border:2px solid #3d3a37;color:#fff;border-radius:8px;padding:12px 14px;font-size:16px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--g)}
.btn{background:#454240;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.15)}
.btn.big{background:var(--g);box-shadow:0 4px 0 var(--g2);padding:15px;font-size:19px}
.btn.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--g2)}
.btn.red{background:#a33}
.tabs{display:flex;background:var(--panel2);border-radius:8px;padding:4px}
.tabs button{flex:1;background:none;border:0;color:var(--t);padding:10px;font-weight:700;border-radius:6px;cursor:pointer;font-size:15px}
.tabs button.on{background:#454240;color:#fff}
.brand{display:inline-block;color:#fff;white-space:nowrap}
.brand i{display:inline-block;font-style:normal;animation:wave 2.6s ease-in-out infinite;animation-delay:calc(var(--i,0)*.12s)}
.brand .gr{color:var(--g);text-shadow:0 0 14px #81b64c99;animation-name:wave,glow;animation-duration:2.6s,2.6s;animation-iteration-count:infinite;animation-delay:calc(var(--i)*.12s)}
.brand .kn{margin-right:4px;animation:knight 3.2s ease-in-out infinite}
@keyframes wave{0%,55%,100%{transform:translateY(0)}25%{transform:translateY(-7px)}}
@keyframes glow{0%,55%,100%{text-shadow:0 0 6px #81b64c55;color:#81b64c}25%{text-shadow:0 0 22px #b6f56ccc;color:#a9e36a}}
@keyframes knight{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-14deg) scale(1.15)}40%{transform:rotate(10deg) scale(1.1)}60%{transform:rotate(0) scale(1)}}
.logo{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.err{color:#ff6b6b;min-height:20px;text-align:center;font-size:14px}
.row{display:flex;gap:8px}
/* top bar */
.top{position:fixed;top:0;left:0;right:0;height:52px;background:var(--panel2);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:5;box-shadow:0 2px 10px #0005}
.top b{font-size:22px}
.top .u{color:var(--t)}.top .u strong{color:#fff}
.lob{padding-top:70px;align-items:flex-start}
#lmsg{color:var(--t);text-align:center;min-height:22px}
/* game */
.gwrap{display:flex;gap:22px;align-items:flex-start;justify-content:center;flex-wrap:wrap;width:100%}
.bcol{width:var(--s)}
.bar{display:flex;align-items:center;justify-content:space-between;height:44px;gap:10px}
.who{display:flex;align-items:center;gap:10px;font-weight:700;min-width:0}
.av{width:34px;height:34px;border-radius:6px;background:#555;display:grid;place-items:center;font-size:20px;flex:none}
.who small{color:var(--t);font-weight:400}
.clock{background:#262421;font:700 22px/1 ui-monospace,Consolas,monospace;padding:8px 12px;border-radius:6px;color:#aaa;min-width:88px;text-align:center}
.clock.act{background:#fff;color:#222}.clock.low{background:#b33;color:#fff}
#board{position:relative;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:var(--s);height:var(--s);aspect-ratio:1/1;flex:none;border-radius:6px;overflow:hidden;user-select:none;box-shadow:0 10px 36px #000a,0 0 0 4px #1d1b19}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;min-width:0;min-height:0}
.sq.l{background:var(--l)}.sq.d{background:var(--d)}
.sq img{position:absolute;inset:0;z-index:2;width:100%;height:100%;object-fit:contain;cursor:grab;-webkit-user-drag:element;filter:drop-shadow(0 3px 2px #0007);transition:transform .15s,filter .15s}
.sq img:hover{transform:translateY(-4%) scale(1.07);filter:drop-shadow(0 9px 6px #0008)}
.sq.last::before,.sq.sel::before{content:"";position:absolute;inset:0;background:#f5f55f88;z-index:1}
.sq.sel::before{background:#ffff0077}
.sq.chk{background-image:radial-gradient(circle,#ff2d2d66,#ff2d2d00 72%)}
.chk::after{content:"";position:absolute;inset:4%;border-radius:50%;border:3px solid #ff4d4d;box-shadow:0 0 16px #ff4d4d,inset 0 0 12px #ff4d4d88;animation:ping 1.3s ease-out infinite;z-index:1;pointer-events:none}
.chk img{animation:shake .45s;filter:drop-shadow(0 0 5px #ff3b3b) drop-shadow(0 0 14px #ff1a1a)}
.mate img{animation:fall .8s .2s both;filter:grayscale(.7) drop-shadow(0 4px 4px #000a)}
@keyframes ping{0%{transform:scale(.55);opacity:1}100%{transform:scale(1.4);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7%)}40%{transform:translateX(7%)}60%{transform:translateX(-4%)}80%{transform:translateX(3%)}}
@keyframes fall{to{transform:rotate(90deg) translate(-8%,18%)}}
#board.enter{animation:bin .6s cubic-bezier(.2,1.3,.4,1)}
#board.enter .sq img{animation:drop .6s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--d)*14ms + .25s)}
@keyframes bin{from{transform:scale(.85) perspective(600px) rotateX(18deg);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-130%) scale(1.25);opacity:0;filter:drop-shadow(0 30px 14px #0005)}to{transform:none;opacity:1}}
.pm{position:absolute;inset:0;background:#000a;z-index:10;animation:fade .2s}
.pc{position:absolute;width:12.5%;background:#fff;border-radius:8px;box-shadow:0 10px 34px #000c;display:flex;flex-direction:column;animation:pm .22s cubic-bezier(.2,1.5,.4,1);transform-origin:top}
.pc.up{flex-direction:column-reverse;transform-origin:bottom}
.pc img{width:100%;display:block;cursor:pointer;border-radius:50%;transition:.15s}
.pc img:hover{background:#ffd9a0;transform:scale(1.1)}
.stat.chkt{color:#ff7b7b}
@keyframes pm{from{transform:scaleY(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media(max-width:900px){.side{width:var(--s);height:220px;margin-top:0}.gwrap{gap:12px}}
.dot{position:absolute;width:30%;height:30%;border-radius:50%;background:#0000002e;z-index:3;pointer-events:none}
.ring{position:absolute;inset:0;background:radial-gradient(transparent 60%,#0000002e 62%);z-index:3;pointer-events:none}
.rk,.fl{position:absolute;z-index:1;font:700 clamp(9px,1.7vw,13px) sans-serif;font-style:normal;pointer-events:none}
.rk{top:2px;left:3px}.fl{bottom:1px;right:4px}
.l .rk,.l .fl{color:var(--d)}.d .rk,.d .fl{color:var(--l)}
.nocoord .rk,.nocoord .fl{display:none}
.noanim #board.enter,.noanim #board.enter .sq img{animation:none!important}
.side{width:320px;max-width:94vw;background:var(--panel);border-radius:10px;display:flex;flex-direction:column;height:var(--s);margin-top:44px;overflow:hidden}
.stat{padding:14px 16px;font-weight:700;font-size:17px;background:var(--panel2);text-align:center}
#moves,#tmoves{flex:1;overflow:auto;padding:8px 6px;display:grid;grid-template-columns:36px 1fr 1fr;align-content:start;font-size:15px}
#moves span{padding:4px 8px;border-radius:4px}#moves .n{color:var(--t)}#moves .cur{background:#454240;font-weight:700}
.acts{display:flex;gap:8px;padding:10px}.acts .btn{flex:1;padding:11px 6px;font-size:15px}
.lgrid{display:grid;grid-template-columns:300px minmax(0,460px);gap:20px;width:100%;max-width:800px;justify-content:center;align-items:start}
.lgrid .card{max-width:none}
.tl{display:flex;align-items:center;gap:12px}
#burger{padding:6px 12px;font-size:20px;line-height:1}
#sdraw{position:fixed;top:52px;left:0;bottom:0;width:320px;max-width:90vw;background:var(--panel);z-index:15;padding:18px;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:6px 0 24px #0008;transform:translateX(-105%);transition:transform .25s}
#sdraw.open{transform:none}
#sov{position:fixed;inset:52px 0 0 0;background:#0006;z-index:14}
.lcol{display:flex;flex-direction:column;gap:20px}
.pcard{align-items:center;text-align:center}
.pav{width:104px;height:104px;border-radius:20px;font-size:58px;cursor:pointer;position:relative;box-shadow:0 6px 18px #0006;transition:.2s}
.pav:hover{transform:scale(1.06) rotate(-3deg)}
.pav::after{content:"✎";position:absolute;right:-8px;bottom:-8px;background:#454240;border-radius:50%;width:32px;height:32px;font-size:15px;display:grid;place-items:center;box-shadow:0 2px 8px #0009}
.prate{color:var(--g);font-weight:800;font-size:18px}
.pst{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.pst div{background:#272522;border-radius:8px;padding:6px 2px}.pst b{display:block;font-size:17px}.pst small{color:var(--t);font-size:11px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;padding:3px 0}
.sw input{width:20px;height:20px;accent-color:var(--g);flex:none}
.top .av{display:inline-grid;vertical-align:middle;margin-right:6px;width:30px;height:30px;font-size:17px}
.cat{color:var(--t);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:6px 0 -4px}
.tcg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.tc{background:#3d3a37;border:2px solid transparent;border-radius:10px;padding:14px 4px;cursor:pointer;color:#fff;font-size:16px;transition:.15s}
.tc:hover{background:#4a4642;transform:translateY(-2px)}
.tc.on{border-color:var(--g);background:#3f4a33;box-shadow:0 0 14px #81b64c44}
.or{text-align:center;color:var(--t);font-size:13px}
.avg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.av.big{width:100%;height:auto;aspect-ratio:1;font-size:34px;border-radius:14px;cursor:pointer;transition:.15s}
.av.big:hover{transform:scale(1.1)}
.av.big.on{outline:3px solid var(--g)}
@media(max-width:760px){.lgrid{grid-template-columns:1fr}}
/* modal */
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20}
#modal .card{max-width:340px;text-align:center;align-items:stretch}
#bw{position:relative;width:var(--s);height:var(--s)}
#ar{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.sq.pre{box-shadow:inset 0 0 0 100px #e0453f88}
.sq.hl-g{box-shadow:inset 0 0 0 100px #81b64caa}.sq.hl-r{box-shadow:inset 0 0 0 100px #eb4034aa}
.sq.hl-y{box-shadow:inset 0 0 0 100px #f2c94caa}.sq.hl-b{box-shadow:inset 0 0 0 100px #3a8ee6aa}
.bdg{position:absolute;top:-3%;right:-3%;width:36%;height:36%;border-radius:50%;z-index:5;display:grid;place-items:center;font:800 clamp(8px,1.9vw,15px) sans-serif;color:#fff;box-shadow:0 2px 5px #000a;pointer-events:none}
#evb{position:relative;height:16px;background:#3a3734;border-radius:8px;overflow:hidden;margin:4px 0}
#evw{height:100%;background:#f1f1f1;width:50%;transition:width .35s}
#evt{position:absolute;right:8px;top:0;font:700 11px/16px sans-serif;color:#fff;mix-blend-mode:difference}
.stat .sub{font-size:13px;font-weight:600;color:var(--t);margin-top:2px}
.rm{cursor:pointer}.rm:hover{background:#3a3734}
.acc{display:flex;gap:8px;padding:8px 10px 6px}.acc div{flex:1;background:#272522;border-radius:8px;padding:6px;text-align:center}
.acc small{color:var(--t)}.acc b{display:block;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 4px;font-size:12px}
.chips span{display:inline-flex;align-items:center;gap:4px;background:#272522;border-radius:12px;padding:2px 8px 2px 2px}
.chips i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff}
.hint{padding:0 10px 6px;font-size:11px;color:var(--t)}
@keyframes fl{0%,100%{translate:0 0;rotate:0deg}25%{translate:3px -9px;rotate:.5deg}50%{translate:0 -14px;rotate:-.4deg}75%{translate:-3px -6px;rotate:.3deg}}
.fl1{animation:fl 6.5s ease-in-out infinite}.fl2{animation:fl 7.5s ease-in-out -3s infinite reverse}
.pav{animation:fl 4.5s ease-in-out -1s infinite}
.lgrid{position:relative;z-index:1}
#rain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#lobby::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1.6px 1.6px at 90px 120px,#cfe0ff,transparent),radial-gradient(1px 1px at 160px 70px,#fff,transparent),radial-gradient(1.2px 1.2px at 230px 180px,#bcd,transparent),radial-gradient(1px 1px at 60px 200px,#fff,transparent);background-size:260px 220px;animation:starsdrift 150s linear infinite}
@keyframes starsdrift{to{background-position:-520px 440px}}
.phys{position:relative;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.pcard{touch-action:none}.dh{touch-action:none;cursor:grab}
.phys input{user-select:text;-webkit-user-select:text;cursor:text}
.phys.free{position:fixed;left:0;top:0;margin:0;z-index:8;animation:none;will-change:transform;cursor:grabbing;box-shadow:0 22px 55px #000c}
.mini{position:absolute;top:8px;right:8px;background:#454240;border:0;color:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:15px}
.mini:hover{background:var(--g)}
.hint2{font-size:12px;color:var(--t);margin-top:-6px}
@media(prefers-reduced-motion:reduce){.fl1,.fl2,.pav,#lobby::before{animation:none!important}}
#modal h2{font-size:26px}
#modal .card{max-width:400px;max-height:92vh;overflow:auto}
.tc{display:flex;flex-direction:column;align-items:center;gap:6px}
.cat{display:flex;align-items:center;gap:6px}
.pv{width:96px;height:96px;border-radius:18px;font-size:52px;margin:0 auto}
#modal .avg{grid-template-columns:repeat(8,1fr);gap:6px}#modal .av.big{font-size:20px;border-radius:8px}
.bots{display:flex;flex-direction:column;gap:8px;text-align:left}
.bot{display:flex;align-items:center;gap:12px;background:#3d3a37;border:2px solid transparent;border-radius:10px;padding:8px 12px;cursor:pointer;transition:.15s}
.bot:hover{background:#4a4642}.bot.on{border-color:var(--g);background:#3f4a33}
.bot small{display:block;color:var(--t)}.bot .av{background:#4a4642;width:40px;height:40px;font-size:24px}
.cols{display:flex;gap:8px}.cols button{flex:1;background:#3d3a37;border:2px solid transparent;border-radius:8px;color:#fff;padding:10px 4px;font-weight:700;cursor:pointer}.cols button.on{border-color:var(--g);background:#3f4a33}
.promo{display:flex;justify-content:center;gap:6px}.promo img{width:68px;height:68px;background:#454240;border-radius:8px;cursor:pointer}.promo img:hover{background:var(--g)}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:#111;color:#fff;padding:12px 20px;border-radius:8px;transition:.3s;z-index:30;opacity:0}
#toast.on{transform:translate(-50%,0);opacity:1}
#conn{position:fixed;top:0;left:0;right:0;background:#c9a227;color:#000;text-align:center;font-weight:700;padding:6px;z-index:40}
/* ===== 3-PLAYER ===== */
#tri{--s:min(96vw,calc(100dvh - 120px),680px)}
.tbars{display:flex;gap:6px;margin-bottom:8px}
.tp3{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:8px;padding:6px 8px;border-bottom:4px solid var(--pc)}
.tp3.act{background:#3f4a33;box-shadow:0 0 0 2px var(--pc)}
.tp3.dead{opacity:.35;filter:grayscale(1)}
.tp3 .av{width:28px;height:28px;font-size:16px}
.tp3 .nm{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;font-size:13px}
.tp3 .nm small{display:block;color:var(--t);font-weight:400;font-size:11px}
.tp3 .tk{font:700 15px ui-monospace,Consolas,monospace}
.tp3 .tk.low{color:#ff6b6b}
#tboard{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));grid-template-rows:repeat(14,minmax(0,1fr));width:var(--s);height:var(--s);border-radius:8px;overflow:hidden;user-select:none;box-shadow:0 10px 36px #000a}
.tq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;min-width:0;min-height:0}
.tq.x{visibility:hidden;cursor:default}
.tq.l{background:var(--l)}.tq.d{background:var(--d)}
.tq.z0{box-shadow:inset 0 0 0 100px #e5483f38}.tq.z1{box-shadow:inset 0 0 0 100px #3f8be538}.tq.z2{box-shadow:inset 0 0 0 100px #f1c40f38}
.tq.last::before,.tq.sel::before{content:"";position:absolute;inset:0;background:#f5f55f88;z-index:1}
.tq.sel::before{background:#ffff0077}
.tq.chk{background-image:radial-gradient(circle,#ff2d2d88,#ff2d2d00 72%)}
.tp{position:relative;z-index:2;font-size:calc(var(--s)/14*.78);line-height:1;pointer-events:none;text-shadow:0 0 2px #000,0 0 2px #000,0 1px 3px #000a;transition:transform .15s}
.tq:hover .tp{transform:translateY(-6%) scale(1.08)}
.tp.c0{color:#e5483f}.tp.c1{color:#3f8be5}.tp.c2{color:#f1c40f}
#tri .side{margin-top:62px}
.tlog{padding:3px 8px;font-size:14px}.tlog b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
#tmoves{display:block}
.tnew{display:inline-block;background:var(--g);color:#000;font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px;vertical-align:middle;margin-left:4px}
.rank{display:flex;align-items:center;gap:10px;background:#272522;border-radius:8px;padding:8px 12px;text-align:left}
.rank b{font-size:22px}
</style>
</head>
<body>
<div id="conn">Connecting to server…</div>

<!-- LOGIN / SIGNUP -->
<div id="auth" class="screen"><div class="card">
  <div class="logo"><span class="brand"><i class="kn">♞</i> <i class="" style="--i:0">E</i><i class="" style="--i:1">f</i><i class="" style="--i:2">e</i><i class="gr" style="--i:3">c</i><i class="gr" style="--i:4">i</i><i class="gr" style="--i:5">i</i><i class="gr" style="--i:6">i</i><i class="gr" style="--i:7">s</i></span></div>
  <div class="tabs"><button id="tl" class="on">Log In</button><button id="ts">Sign Up</button></div>
  <input id="u" placeholder="Username" autocomplete="username" maxlength="16">
  <input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <input id="p2" type="password" placeholder="Confirm password" class="hide">
  <button class="btn big" id="go">Log In</button>
  <div class="err" id="aerr"></div>
</div></div>

<!-- LOBBY -->
<div id="lobby" class="screen lob hide">
  <div class="top"><div class="tl"><button class="btn" id="burger" title="Settings">☰</button><b><span class="brand"><i class="kn">♞</i> <i class="" style="--i:0">E</i><i class="" style="--i:1">f</i><i class="" style="--i:2">e</i><i class="gr" style="--i:3">c</i><i class="gr" style="--i:4">i</i><i class="gr" style="--i:5">i</i><i class="gr" style="--i:6">i</i><i class="gr" style="--i:7">s</i></span></b></div><div class="u"><span class="av" id="tav"></span> <strong id="uname"></strong> · <span id="urate"></span> <button class="btn" id="lo" style="padding:6px 12px;margin-left:10px;font-size:13px">Log out</button></div></div>
  <div id="sov" class="hide"></div>
  <div id="sdraw">
        <h2>⚙ Settings</h2>
        <div class="cat">Board theme</div>
        <select id="theme"></select>
        <div class="cat">Game</div>
        <div id="sets"></div>
        <button class="btn" id="pwb">🔑 Change password</button>
      </div>
  <div class="lgrid">
    <div class="lcol">
      <div class="slot" id="pslot"><div class="card pcard phys fl1" id="pcard">
        <div class="pav av" id="pav" title="Change avatar"></div>
        <h2 id="pname"></h2><div class="prate" id="prate"></div>
        <div class="pst" id="pst"></div>
        <button class="btn" id="pch">✎ Edit profile</button>

<script>
/* ======== CONFIG ======== */

/* ======================== */
const C = Chess, T = Tri, $ = id => document.getElementById(id);

/* ---------- settings (saved in this browser) ---------- */

/* ---------- auth UI ---------- */

const AVS = ['♞', '🐺', '🦊', '🐼', '🦁', '🐯', '🐸', '🐙', '🦉', '🐲', '👑', '🚀', '🔥', '💎', '🧠', '🎯'];

  $('pst').innerHTML = b(s.g, 'Games') + b(s.w, 'Wins') + b(s.d, 'Draws') + b(s.l, 'Losses') + b(s.g3, '3P games') + b(s.p1, '3P 🥇') + b(s.p2, '3P 🥈') + b(s.p3, '3P 🥉');
}

function editProfile() {
  $('mc').innerHTML = `<h2>Edit profile</h2><div class="av pv" id="epv"></div>
    <div class="row"><button class="btn" id="eup" style="flex:1">📷 Upload photo</button><button class="btn" id="erm">Remove</button></div>

  const refresh = () => { setAv($('epv'), me.a, me.pic); profile(); $('mc').querySelectorAll('.avg .av').forEach(e => e.classList.toggle('on', !me.pic && +e.dataset.a === me.a)); };
  $('mc').querySelectorAll('.avg .av').forEach(e => { setAv(e, +e.dataset.a); e.onclick = () => { me.a = +e.dataset.a; me.pic = null; send({ t: 'avatar', a: me.a, pic: null }); refresh(); }; });
  $('eup').onclick = () => $('efile').click();
  $('efile').onchange = e => { const f = e.target.files[0]; if (!f) return; readImg(f).then(u => { me.pic = u; send({ t: 'avatar', a: me.a, pic: u }); refresh(); }).catch(() => toast('Could not read that image')); };
  $('erm').onclick = () => { me.pic = null; send({ t: 'avatar', a: me.a, pic: null }); refresh(); };
  $('esv').onclick = () => { const u = $('enm').value.trim(); if (u.length < 3) return toast('Username must be at least 3 characters'); send({ t: 'rename', u }); };
  $('enm').addEventListener('keydown', e => e.key === 'Enter' && $('esv').click());
  $('edn').onclick = () => $('modal').classList.add('hide');
  refresh(); $('modal').classList.remove('hide');
}
$('pav').onclick = $('pch').onclick = editProfile;
const IC = {
  Bullet: c => `<svg viewBox="0 0 24 24" width="22" height="22" fill="${c}"><path d="M12 1.5c3.2 3 4.5 6.6 4.5 10v7h-9v-7c0-3.4 1.3-7 4.5-10z"/><rect x="7.5" y="20" width="9" height="2.5" rx="1"/></svg>`,
  Blitz: c => `<svg viewBox="0 0 24 24" width="22" height="22" fill="${c}"><path d="M13.5 1L4 14h6.5l-1.5 9L20 9.5h-6.5z"/></svg>`,
  Rapid: c => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 8.5V13l3 2M9.5 2.5h5"/></svg>`
};
const CC = { Bullet: '#ffb02e', Blitz: '#ffe14a', Rapid: '#81b64c' };
const TCS = [['Bullet', [[60, 0], [120, 1]]], ['Blitz', [[180, 0], [180, 2], [300, 0]]], ['Rapid', [[600, 0], [900, 10], [1800, 0]]]];
let tcSel = [300, 0], tcCat = 'Blitz';
$('tcs').innerHTML = TCS.map(([n, l]) => `<div class="cat">${IC[n](CC[n])}${n}</div><div class="tcg">` + l.map(([b, i]) => `<button class="tc ${b === 300 && i === 0 ? 'on' : ''}" data-b="${b}" data-i="${i}" data-n="${n}">${IC[n](CC[n])}<span>${b / 60}${i ? ' | ' + i : ' min'}</span></button>`).join('') + '</div>').join('');
$('tcs').querySelectorAll('.tc').forEach(t => t.onclick = () => { $('tcs').querySelectorAll('.tc').forEach(x => x.classList.remove('on')); t.classList.add('on'); tcSel = [+t.dataset.b, +t.dataset.i]; tcCat = t.dataset.n; rainBurst(tcCat); });
$('pm').querySelectorAll('button').forEach(b => b.onclick = () => {
  nSel = +b.dataset.n; $('pm').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  $('bb').classList.toggle('hide', nSel === 3); $('n3').classList.toggle('hide', nSel !== 3);
});
$('bq').onclick = () => send({ t: 'queue', tc: tcSel, n: nSel });
$('bc').onclick = () => send({ t: 'create', tc: tcSel, n: nSel });
$('bj').onclick = () => send({ t: 'join', code: $('code').value });
$('bx').onclick = () => { send({ t: 'cancel' }); setWait(false); };

/* ---------- game ---------- */
function applyWire(w) {
  const m = C.find(G.st, w); if (!m) return;
  G.san.push(C.san(G.st, m)); G.st = C.apply(G.st, m); G.last = m; G.sel = null; G.arrows = []; G.hls = []; (G.mv || (G.mv = [])).push(w); G.legal = C.legal(G.st);
  if (G.live) { G.anim = [m]; if (m.ca) G.anim.push({ fr: m.fr, fc: m.ca === 'K' ? 7 : 0, tr: m.tr, tc: m.ca === 'K' ? 5 : 3 }); }
}
function startGame(m) {
  setWait(false); TG = null;
  G = { id: m.id, color: m.color, w: m.white, b: m.black, st: C.init(), san: [], last: null, sel: null, over: false };
  G.legal = C.legal(G.st);
  G.live = false; m.moves.forEach(applyWire); G.live = true; G.intro = true;
  G.clock = m.clock; G.t0 = Date.now();

}
function endGame(m) {
  if (!G || G.over) return; G.over = true; G.pres = []; G.mate = m.reason === 'checkmate';
  const r = m.result, mine = G.color === 'w' ? '1-0' : '0-1';
  const title = r === '1/2-1/2' ? 'Draw' : r === mine ? 'You Won! 🏆' : 'You Lost';
  const old = me.rating; me.rating = m.ratings[G.color]; profile();
  const d = me.rating - old;
  $('mc').innerHTML = `<h2>${title}</h2><div style="color:var(--t)">by ${m.reason}</div>${G.bot ? '' : `<div style="font-size:18px">Rating ${me.rating} <b style="color:${d >= 0 ? 'var(--g)' : '#ff6b6b'}">(${d >= 0 ? '+' : ''}${d})</b></div>`}<button class="btn big" id="mb">Back to lobby</button>${G.bot ? '<button class="btn" id="mr">Play again</button>' : ''}<button class="btn" id="mrv">📊 Game Review</button><button class="btn" id="mv">View board</button>`;
  $('modal').classList.remove('hide');
  $('mb').onclick = () => { $('modal').classList.add('hide'); G = null; show('lobby'); };
  $('mrv').onclick = () => { $('modal').classList.add('hide'); startReview(); };
  if ($('mr')) $('mr').onclick = () => startBot(G.lv, G.color === 'w' ? 'b' : 'w');
  $('mv').onclick = () => { $('modal').classList.add('hide'); overStat(); };
  render();
}
function render() {
  const real = G.rv ? G.rv.st : G.st, s = queued() ? virt() : real, flip = G.color === 'b', top = flip ? 'w' : 'b', bot = G.color;
  const P = c => G[c], nm = c => `${P(c).u} <small>(${P(c).r})</small>`;
  $('nt').innerHTML = nm(top); $('nb').innerHTML = nm(bot); setAv($('avt'), P(top).a, P(top).pic, P(top).emoji); setAv($('avb'), P(bot).a, P(bot).pic, P(bot).emoji);
  const kp = C.inCheck(real) ? C.kingPos(real.b, real.turn) : null;
  const tgt = G.sel ? (G.st.turn === G.color ? G.legal : preMoves()).filter(m => m.fr === G.sel[0] && m.fc === G.sel[1]) : [];
  let h = '';
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
    const r = flip ? 7 - i : i, c = flip ? 7 - j : j, p = s.b[r][c];
    let cl = 'sq ' + ((r + c) % 2 ? 'd' : 'l');
    { const LM = G.rv ? G.rv.last : G.last; if (LM && ((LM.fr === r && LM.fc === c) || (LM.tr === r && LM.tc === c))) cl += ' last'; }
    if (G.sel && G.sel[0] === r && G.sel[1] === c) cl += ' sel';
    if ((G.pres || []).some(q => (q.fr === r && q.fc === c) || (q.tr === r && q.tc === c))) cl += ' pre';
    { const hl = (G.hls || []).find(h => h.r === r && h.c === c); if (hl) cl += ' hl-' + hl.col; }
    if (kp && kp[0] === r && kp[1] === c) cl += ' chk' + (G.mate && (!G.rv || G.rv.i === G.rv.n) ? ' mate' : '');
    const t = S.hints && tgt.some(m => m.tr === r && m.tc === c);
    h += `<div class="${cl}" data-r="${r}" data-c="${c}">` + (j === 0 ? `<i class="rk">${8 - r}</i>` : '') + (i === 7 ? `<i class="fl">${'abcdefgh'[c]}</i>` : '') +
      (t ? `<b class="${p ? 'ring' : 'dot'}"></b>` : '') + (G.rv && G.rv.cur && G.rv.cur.tr === r && G.rv.cur.tc === c ? `<span class="bdg" style="background:${CL[G.rv.cur.cls].c}">${CL[G.rv.cur.cls].s}</span>` : '') + (p ? `<img src="${PIECES}${p}.png" alt="${p}" style="--d:${i * 8 + j}" draggable="${!G.over && p[0] === G.color}">` : '') + '</div>';
  }

  $('board').classList.toggle('enter', !!G.intro); G.intro = false;
  if (G.anim) {
    if (S.anim) for (const m of G.anim) {
      const im = $('board').querySelector(`.sq[data-r="${m.tr}"][data-c="${m.tc}"] img`); if (!im) continue;
      const k = flip ? -1 : 1;
      im.style.transition = 'none'; im.style.zIndex = 9;
      im.style.transform = `translate(${k * (m.fc - m.tc) * 100}%,${k * (m.fr - m.tr) * 100}%)`;
      im.getBoundingClientRect();

    }

  }

  $('moves').innerHTML = mh; $('moves').scrollTop = 1e6;
  drawArrows(flip); syncReviewUI(); if (G.rv) rvPanel();
  if (!G.over) $('stat').textContent = real.turn === G.color ? (kp ? 'Your move – you are in check!' : 'Your move') : (kp ? "Check! Opponent's move" : "Opponent's move");
  $('stat').classList.toggle('chkt', !!kp && !G.over);
  clocks();
}
const fmt = ms => { ms = Math.max(0, ms); const s = Math.ceil(ms / 1000); return ms < 10000 && ms > 0 ? (ms / 1000).toFixed(1) : String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function clocks() {
  if (!G) return;
  if (G.bot) { $('ct').textContent = $('cb').textContent = '—'; $('ct').className = 'clock'; $('cb').className = 'clock' + (!G.over && G.st.turn === G.color ? ' act' : ''); return; }
  for (const x of ['w', 'b']) {
    const run = !G.over && G.st.turn === x, t = G.clock[x] - (run ? Date.now() - G.t0 : 0);
    const e = $(x === G.color ? 'cb' : 'ct'); e.textContent = fmt(t);
    e.className = 'clock' + (run ? ' act' : '') + (run && t < 20000 ? ' low' : '');
  }
}

/* ---------- input: click + drag ---------- */
const mayMove = () => G && !G.over && G.st.turn === G.color;
function tryTo(r, c) {
  const ms = G.legal.filter(m => m.fr === G.sel[0] && m.fc === G.sel[1] && m.tr === r && m.tc === c);

}
function doMove(m) { if (G.bot) { G.sel = null; $('modal').classList.add('hide'); localMove(m); return; } send({ t: 'move', m: C.wire(m) }); G.sel = null; $('modal').classList.add('hide'); render(); }

}
function tRender() {

$('tboard').addEventListener('click', e => {

  $('mc').innerHTML = `<h2>${['You Won! 🏆', '2nd place 🥈', '3rd place 🥉'][pos]}</h2>` +
    m.rank.map((p, i) => `<div class="rank"><b>${med[i]}</b><span style="color:${TCOL[p]}">●</span><span style="flex:1">${TG.pl[p].u}</span><small>${m.deltas[p] >= 0 ? '+' : ''}${m.deltas[p]}</small></div>`).join('') +
    `<div style="font-size:18px">Rating ${me.rating} <b style="color:${d >= 0 ? 'var(--g)' : '#ff6b6b'}">(${d >= 0 ? '+' : ''}${d})</b></div><button class="btn big" id="tb">Back to lobby</button><button class="btn" id="tv">View board</button>`;
  $('modal').classList.remove('hide');
  $('tb').onclick = () => { $('modal').classList.add('hide'); TG = null; show('lobby'); };
  $('tv').onclick = () => { $('modal').classList.add('hide'); $('tstat').innerHTML = 'Game over <button class="btn" id="tl2" style="padding:4px 10px;margin-left:6px">Lobby</button>'; $('tl2').onclick = () => { TG = null; show('lobby'); }; };
  if (!$('tl2')) $('tstat').textContent = 'Game over';
}

/* ---------- lobby: floating cards you can drag & throw ---------- */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const BODIES = [];
function makeBody(card, slot, resetBtn, handle) {

      slot.style.minHeight = r.height + 'px'; card.style.width = r.width + 'px'; card.classList.add('free'); resetBtn.classList.remove('hide');
    }

    B.x = nx; B.y = ny; B.hist.push([performance.now(), e.clientX, e.clientY]); if (B.hist.length > 6) B.hist.shift();
  });

    if (!B.drag) return; B.drag = false;
    if (!B.moved) { if (B.t && B.t.closest('#pav')) editProfile(); return; }
    const h = B.hist;
    if (h.length > 1 && performance.now() - h[h.length - 1][0] < 90) {
      const a = h[0], b = h[h.length - 1], dt = Math.max(.016, (b[0] - a[0]) / 1000), c = v => Math.max(-2600, Math.min(2600, v));

makeBody($('pcard'), $('pslot'), $('preset'));
makeBody($('pplay'), $('qslot'), $('qreset'), '.dh');
let PHL = 0;
function physics(t) {
  requestAnimationFrame(physics);
  const dt = Math.min(.033, (t - PHL) / 1000 || 0); PHL = t;
  const lobby = !$('lobby').classList.contains('hide');
  for (const B of BODIES) {
    if (!B.free) continue;
    if (!B.drag && lobby) {
      B.x += B.vx * dt; B.y += B.vy * dt;
      const k = Math.pow(.992, dt * 60); B.vx *= k; B.vy *= k;
      const W = innerWidth, H = innerHeight, top = 54, e = .85;
      if (B.x < 0) { B.x = 0; B.vx = Math.abs(B.vx) * e; } if (B.x + B.w > W) { B.x = Math.max(0, W - B.w); B.vx = -Math.abs(B.vx) * e; }
      if (B.y < top) { B.y = top; B.vy = Math.abs(B.vy) * e; } if (B.y + B.h > H) { B.y = Math.max(top, H - B.h); B.vy = -Math.abs(B.vy) * e; }
      for (const O of BODIES) {

        const o = O.free ? { left: O.x, top: O.y, right: O.x + O.w, bottom: O.y + O.h } : O.card.getBoundingClientRect();
        if (!(B.x < o.right && B.x + B.w > o.left && B.y < o.bottom && B.y + B.h > o.top)) continue;
        const dl = B.x + B.w - o.left, dr = o.right - B.x, dtp = B.y + B.h - o.top, db = o.bottom - B.y, m = Math.min(dl, dr, dtp, db), mv = O.free && !O.drag;
        if (m === dl) { B.x -= dl; if (mv) [B.vx, O.vx] = [Math.min(O.vx, 0) * e - 60, Math.max(B.vx, 0) * e + 60]; else B.vx = -Math.abs(B.vx) * e; }
        else if (m === dr) { B.x += dr; if (mv) [B.vx, O.vx] = [Math.max(O.vx, 0) * e + 60, Math.min(B.vx, 0) * e - 60]; else B.vx = Math.abs(B.vx) * e; }
        else if (m === dtp) { B.y -= dtp; if (mv) [B.vy, O.vy] = [Math.min(O.vy, 0) * e - 60, Math.max(B.vy, 0) * e + 60]; else B.vy = -Math.abs(B.vy) * e; }
        else { B.y += db; if (mv) [B.vy, O.vy] = [Math.max(O.vy, 0) * e + 60, Math.min(B.vy, 0) * e - 60]; else B.vy = Math.abs(B.vy) * e; }

}
requestAnimationFrame(physics);

/* ---------- weather: bullets / lightning storm / clocks ---------- */
const RIMG = {};
for (const n of ['Bullet', 'Blitz', 'Rapid']) {
  const im = new Image();
  im.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(IC[n](CC[n]).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ').replace('width="22" height="22"', 'width="64" height="64"'));
  RIMG[n] = im;
}
const RC = $('rain'), rx = RC.getContext('2d');
let rP = [], rBolts = [], rQueue = null, rBurst = 0, rBurstCat = 'Blitz', rRun = false, rLast = 0, rAcc = 0, rAcc2 = 0, rBoltT = 0, rStorm = 0;
function rSize() { const d = Math.min(devicePixelRatio || 1, 2); RC.width = innerWidth * d; RC.height = innerHeight * d; rx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', rSize); rSize();

function rainStart(cat) { if (RM || !S.fx) return; rQueue = cat; if (cat === 'Blitz') rBoltT = Math.min(rBoltT, .3); rKick(); }
function rainStop() { rQueue = null; }
function spawn(cat) {
  const bu = cat === 'Bullet';
  rP.push({ cat, x: Math.random() * innerWidth, y: -50, s: bu ? 20 + Math.random() * 14 : 24 + Math.random() * 18,
    vy: bu ? 800 + Math.random() * 500 : 170 + Math.random() * 150, rot: bu ? Math.PI + (Math.random() - .5) * .1 : (Math.random() - .5) * .6, vr: bu ? 0 : (Math.random() - .5) * 2 });
}
function spawnDrop() { rP.push({ drop: true, x: Math.random() * (innerWidth + 200), y: -20, vx: -140, vy: 950 + Math.random() * 500 }); }
function mkBolt(x0, x1, y1) {
  const pts = [[x0, -10]], n = Math.max(6, Math.round((y1 + 10) / 22));
  for (let i = 1; i <= n; i++) pts.push([x0 + (x1 - x0) * i / n + (i < n ? (Math.random() - .5) * 46 : 0), -10 + (y1 + 10) * i / n]);
  const br = [];
  for (let k = 0; k < 2; k++) {
    let [bx, by] = pts[2 + Math.floor(Math.random() * (n - 3))]; const seg = [[bx, by]], d = Math.random() < .5 ? -1 : 1;
    for (let j = 0; j < 4; j++) { bx += d * (10 + Math.random() * 18); by += 14 + Math.random() * 16; seg.push([bx, by]); }
    br.push(seg);
  }
  return { pts, br, x1, y1, age: 0, life: .55 };
}
function strike() {
  let tx = 60 + Math.random() * (innerWidth - 120), ty = innerHeight * (.45 + Math.random() * .5), card = null;
  if (Math.random() < .65) {
    const c = BODIES[Math.floor(Math.random() * BODIES.length)].card, r = c.getBoundingClientRect();
    if (r.width && r.top > 20) { card = c; tx = r.left + r.width * (.2 + Math.random() * .6); ty = r.top + 4; }
  }
  rBolts.push(mkBolt(tx + (Math.random() - .5) * 200, tx, ty));
  if (card && card.animate) card.animate([{ filter: 'brightness(1)', boxShadow: '0 0 0 #0000' }, { filter: 'brightness(1.7)', boxShadow: '0 0 60px #9cc4ff', offset: .15 }, { filter: 'brightness(1)', boxShadow: '0 0 0 #0000' }], { duration: 420 });
}
function drawBolt(b) {
  const f = b.age < .07 ? 1 : b.age < .13 ? .25 : b.age < .2 ? 1 : Math.max(0, 1 - (b.age - .2) / (b.life - .2));
  if (b.age < .25) { rx.fillStyle = `rgba(190,210,255,${.3 * (1 - b.age / .25)})`; rx.fillRect(0, 0, innerWidth, innerHeight); }
  const g = rx.createRadialGradient(b.x1, b.y1, 0, b.x1, b.y1, 110);
  g.addColorStop(0, `rgba(190,215,255,${.75 * f})`); g.addColorStop(1, 'rgba(190,215,255,0)'); rx.fillStyle = g; rx.fillRect(b.x1 - 110, b.y1 - 110, 220, 220);
  const path = (pts, w, col) => { rx.beginPath(); pts.forEach((q, i) => i ? rx.lineTo(q[0], q[1]) : rx.moveTo(q[0], q[1])); rx.lineWidth = w; rx.strokeStyle = col; rx.stroke(); };
  rx.lineJoin = 'round'; rx.shadowColor = '#8fb8ff'; rx.shadowBlur = 20;
  path(b.pts, 5, `rgba(143,184,255,${.7 * f})`); b.br.forEach(s => path(s, 3, `rgba(143,184,255,${.5 * f})`));
  rx.shadowBlur = 0; path(b.pts, 2, `rgba(255,255,255,${f})`); b.br.forEach(s => path(s, 1.2, `rgba(255,255,255,${.8 * f})`));

function rLoop(t) {

  const lobby = !$('lobby').classList.contains('hide');
  if (!lobby) { rP = []; rBolts = []; rBurst = 0; rStorm = 0; }
  const cat = rBurst > 0 ? rBurstCat : rQueue, storm = lobby && cat === 'Blitz';
  rStorm += ((storm ? 1 : 0) - rStorm) * Math.min(1, dt * 3);
  if (lobby && cat) {
    if (storm) {
      rAcc2 += dt * (rBurst > 0 ? 170 : 100); while (rAcc2 >= 1) { rAcc2--; spawnDrop(); }
      rBoltT -= dt; if (rBoltT <= 0) { strike(); rBoltT = rBurst > 0 ? .55 + Math.random() * .4 : 1.1 + Math.random() * 2.2; }
    } else { rAcc += dt * (rBurst > 0 ? 45 : 14); while (rAcc >= 1) { rAcc--; spawn(cat); } }
  }

  rx.clearRect(0, 0, innerWidth, innerHeight);

}
