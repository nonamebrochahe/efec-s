<script>
const{V,isW,init,make,legal,inChk,isCap,pick,over}=E,$=id=>document.getElementById(id);
const G={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'},gl=p=>G[p.toLowerCase()]+'\uFE0E',sqn=i=>'abcdefgh'[i&7]+(8-(i>>3));
const BN=[['Pawnie','Rastgele oynar.','🐣'],['Rookie','Taş kapar ama hata yapar.','🦊'],['Knightro','2 hamle ilerisini görür.','🐴'],['Bishop Bot','3 hamle derin düşünür.','🦉']];
const TCL=[['1+0','Bullet'],['1+1','Bullet'],['3+0','Blitz'],['3+2','Blitz'],['5+0','Blitz'],['10+0','Rapid'],['15+10','Rapid']];
let tc='10+0',hb=1,hs='r',tab='lobby',me=null,seeking=false;
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch{}};
/* ayarlar */
let set={fx:1,cap:1,chk:1,snd:1,hint:1,coord:1,board:'green',pcs:'solid'};
try{Object.assign(set,JSON.parse(ls('set')||'{}'))}catch{}
function applySet(){const b=document.body;b.dataset.board=set.board;b.dataset.pcs=set.pcs;
 b.classList.toggle('fxb',!!set.fx);b.classList.toggle('fxc',!!set.cap);b.classList.toggle('fxchk',!!set.chk);b.classList.toggle('nohint',!set.hint);b.classList.toggle('nocoord',!set.coord);ls('set',JSON.stringify(set))}
for(const k of['fx','cap','chk','snd','hint','coord'])$('s-'+k).onchange=e=>{set[k]=e.target.checked?1:0;applySet()};
for(const k of['board','pcs'])$('s-'+k).onchange=e=>{set[k]=e.target.value;applySet()};
function openSet(){for(const k of['fx','cap','chk','snd','hint','coord'])$('s-'+k).checked=!!set[k];$('s-board').value=set.board;$('s-pcs').value=set.pcs;$('mset').classList.add('show')}
$('sets').onclick=openSet;$('sclose').onclick=()=>$('mset').classList.remove('show');applySet();
/* ses */
let AC;function snd(t){if(!set.snd)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
 const f={mv:[330,.08],cp:[150,.14],ck:[620,.18],end:[220,.4]}[t];o.type=t==='cp'?'sawtooth':'triangle';o.frequency.setValueAtTime(f[0],n);o.frequency.exponentialRampToValueAtTime(f[0]/2,n+f[1]);
 g.gain.setValueAtTime(.2,n);g.gain.exponentialRampToValueAtTime(.001,n+f[1]);o.connect(g).connect(AC.destination);o.start();o.stop(n+f[1])}catch{}}

/* ağ bağlantısı
   GitHub Pages HTTPS kullandığı için VPS'ye WSS ile bağlanmalısın.
   VPS IP adresi: 45.131.1.62:3000. Bu ws:// adresi yalnızca oyun HTTP üzerinden açıldığında çalışır. GitHub Pages/HTTPS için alan adı ve WSS/TLS gerekir.
*/
const DEFAULT_WS_URL = 'ws://45.131.1.62:3000';
const WS_URL = (() => {
  try {
    const fromQuery = new URLSearchParams(location.search).get('ws');
    const url = fromQuery || DEFAULT_WS_URL;
    if (!/^wss?:\/\//i.test(url)) throw new Error('WebSocket adresi ws:// veya wss:// ile başlamalı.');
    if (location.protocol === 'https:' && url.startsWith('ws://'))
      throw new Error('HTTPS sayfası ws:// kullanamaz; wss:// ve geçerli TLS sertifikası gerekir.');
    if (url.includes('YOUR_DOMAIN_HERE'))
      console.warn('WebSocket adresi ayarlanmadı. DEFAULT_WS_URL değerini kendi alan adınla değiştir.');
    return url;
  } catch (e) {
    console.error('WebSocket ayarı hatalı:', e);
    return '';
  }
})();
let ws, reconnectTimer = null, manualClose = false;
const tx = o => {
  if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify(o)); return true; }
  toast('Sunucuya bağlı değil. WebSocket adresini ve VPS durumunu kontrol et.');
  return false;
};
function conn(){
  if (!WS_URL) { toast('WebSocket adresi hatalı. Kod içindeki DEFAULT_WS_URL değerini düzelt.'); return; }
  if (WS_URL.includes('YOUR_DOMAIN_HERE')) {
    console.error('WebSocket bağlantısı başlatılmadı: DEFAULT_WS_URL adresini kendi WSS alan adınla değiştir.');
    $('aerr').textContent = 'Sunucu adresi ayarlanmamış. Kodda DEFAULT_WS_URL değerini kendi WSS alan adınla değiştir.';
    return;
  }
  try { ws = new WebSocket(WS_URL); }
  catch (e) { console.error('WebSocket oluşturulamadı:', e); scheduleReconnect(); return; }
  ws.onopen = () => {
    console.info('WebSocket bağlandı:', WS_URL);
    $('aerr').textContent = '';
    const t = ls('tok'); if (t) tx({a:'resume', tok:t});
  };
  ws.onmessage = e => {
    try { on(JSON.parse(e.data)); }
    catch (err) { console.error('Sunucu mesajı işlenemedi:', err, e.data); }
  };
  ws.onerror = e => {
    console.error('WebSocket bağlantı hatası. WSS alan adı, TLS ve Nginx proxy ayarlarını kontrol et.', e);
  };
  ws.onclose = e => {
    console.warn('WebSocket kapandı:', e.code, e.reason || '(sebep belirtilmedi)');
    if (!manualClose) scheduleReconnect();
  };
}
function scheduleReconnect(){
  if (manualClose || reconnectTimer) return;
  reconnectTimer = setTimeout(() => { reconnectTimer = null; conn(); }, 2500);
}

$('li').onclick=()=>auth(0);$('rg').onclick=()=>auth(1);$('pw').onkeydown=e=>e.key==='Enter'&&auth(0);
$('out').onclick=()=>{ls('tok','');location.reload()};

 case'authok':me=d;ls('tok',d.tok);setMe();if(mode!=='online')show('home');break;

   b.onclick=()=>tx(mine?{a:'cancel'}:{a:'accept',id:s.id});r.appendChild(b);l.appendChild(r)}break}
 case'code':$('codebox').innerHTML=`Kod: <b style="color:var(--acc);letter-spacing:3px">${d.c}</b><br><span class="mute">Arkadaşına gönder, o "Katıl" desin.</span>`;break;
 case'start':startOnline(d);break;

/* oyun durumu */
let mode='bot',S,hist,H,lvl=1,flip,sel=null,busy=false,done=false,anim=false,capt=false,gid=0,LM,CK=null,CKT=0,opp=null;

 for(const[f,t,p]of d.mv){const m=legal(S).find(x=>x.f===f&&x.t===t&&(x.p||null)===p);const ns=make(S,m);hist.push({s:S,m,san:san(S,m,ns)});S=ns}

 me.e=H==='w'?d.w.e:d.b.e;setMe();const dl=H==='w'?d.d:-d.d;
 $('et').textContent=d.res==='d'?'½ Beraberlik':mine?'🏆 Kazandın!':'Kaybettin';
 $('eb').textContent=`${w?w+' kazandı — ':''}${d.why} · Rating ${dl>=0?'+':''}${dl} → ${me.e}`;$('mend').classList.add('show');snd('end');stText();render()}
$('eok').onclick=()=>{$('mend').classList.remove('show')};
function ui(){const on=mode==='online';$('un2').style.display=on?'none':'';$('nw').style.display=on?'none':'';$('dr').style.display=on?'':'none';$('rs').style.display=on?'':'none'}
function stText(){let t;const o=done?null:(mode==='local'?null:0);
 if(mode!=='online'){const r=over(S);if(r&&!done){done=true;snd('end');t=r[1]==='mat'?(lvl<0?(r[0]==='w'?'Beyaz':'Siyah')+' mat etti!':r[0]===H?'Mat — kazandın!':'Mat — bot kazandı!'):'Berabere — '+r[1]}}
 if(!t){if(done)t=$('st').textContent;else{const c=inChk(S)?' — şah!':'';t=lvl<0&&mode!=='online'?(S.t==='w'?'Beyaz':'Siyah')+' oynuyor'+c:S.t===H?'Sıra sende'+c:(mode==='online'?opp.n:BN[lvl][0])+' düşünüyor…'}}
 $('st').textContent=t}
function update(){LM=legal(S);stText();render();
 if(!done&&mode==='bot'&&S.t!==H){busy=true;const g=gid;setTimeout(()=>{if(g!==gid)return;const m=pick(S,lvl);busy=false;ap(m)},350)}}
function ap(m){const ns=make(S,m);capt=isCap(S,m);anim=true;hist.push({s:S,m,san:san(S,m,ns)});S=ns;sel=null;LM=legal(S);
 const ck=inChk(S);snd(ck?'ck':capt?'cp':'mv');if(capt&&set.cap){const b=$('board');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
 if(mode==='online'){CKT=Date.now();render();stText()}else update()}
function setCk(c){CK=c;CKT=Date.now();tickCk()}
function fmt(ms){ms=Math.max(0,ms);const s=ms/1000;return s<10?s.toFixed(1):Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function tickCk(){const tk=$('tk'),bk=$('bk');if(!CK||mode!=='online'){tk.textContent=bk.textContent='';return}
 const top=flip?'w':'b',bot=flip?'b':'w',v=c=>CK[c]-(!done&&S.t===c?Date.now()-CKT:0);
 for(const[el,c]of[[tk,top],[bk,bot]]){const x=v(c);el.textContent=fmt(x);el.className='clk'+(!done&&S.t===c?' act':'')+(x<10000&&!done?' low':'')}}
setInterval(tickCk,100);
function render(){const B=$('board');B.innerHTML='';const last=hist.length?hist[hist.length-1].m:null;
 const ck=inChk(S)?S.b.indexOf(S.t==='w'?'K':'k'):-1,tg=sel!==null?LM.filter(m=>m.f===sel):[];
 for(let dr=0;dr<8;dr++)for(let dc=0;dc<8;dc++){const i=flip?(7-dr)*8+7-dc:dr*8+dc,p=S.b[i],e=document.createElement('div');
  e.className='sq '+(((i>>3)+(i&7))%2?'d':'l')+(last&&(i===last.f||i===last.t)?' last':'')+(i===sel?' sel':'')+(i===ck?' chk':'');
  const mv=tg.find(m=>m.t===i);if(mv)e.className+=' mv'+(isCap(S,mv)?' cp':'');
  let h='';if(dc===0)h+=`<span class="c r">${8-(i>>3)}</span>`;if(dr===7)h+=`<span class="c f">${'abcdefgh'[i&7]}</span>`;
  if(p!=='.'){const am=anim&&last&&i===last.t,q=x=>[flip?7-(x>>3):x>>3,flip?7-(x&7):x&7],a=am?q(last.f):0,z=am?q(last.t):0;if(am){e.style.zIndex=5;if(capt)e.className+=' burst'}
   h+=`<span class="pc ${isW(p)?'w':'b'}${am?' mvd':''}"${am?` style="--dx:${a[1]-z[1]};--dy:${a[0]-z[0]}"`:''}>${gl(p)}</span>`}
  e.innerHTML=h;e.onclick=()=>click(i);B.appendChild(e)}
 const nm=c=>mode==='local'?(c==='w'?'Beyaz':'Siyah'):mode==='online'?(c===H?me.n:opp.n)+' ('+(c===H?me.e:opp.e)+')':c===H?'Sen':BN[lvl][0],bot=flip?'b':'w',top=flip?'w':'b';
 $('bn').textContent=nm(bot);$('tn').textContent=nm(top);
 const cp=c=>{const ini={p:8,n:2,b:2,r:2,q:1},cnt={};S.b.forEach(x=>{if(x!=='.'&&isW(x)===(c==='w'))cnt[x.toLowerCase()]=(cnt[x.toLowerCase()]||0)+1});let s='';for(const t of'qrbnp')s+=G[t].repeat(Math.max(0,ini[t]-(cnt[t]||0)));return s};
 $('bc').textContent=cp(top);$('tc').textContent=cp(bot);
 const ml=$('ml');ml.innerHTML='';hist.forEach((h,k)=>{if(k%2===0)ml.insertAdjacentHTML('beforeend',`<span>${k/2+1}.</span>`);ml.insertAdjacentHTML('beforeend',`<span>${h.san}</span>`)});
 if(hist.length%2)ml.insertAdjacentHTML('beforeend','<span></span>');ml.scrollTop=ml.scrollHeight;anim=false;tickCk()}
function click(i){if(done||busy||(mode!=='local'&&S.t!==H))return;
 const ms=sel!==null?LM.filter(m=>m.f===sel&&m.t===i):[];
 if(ms.length){const go=m=>mode==='online'?(tx({a:'move',f:m.f,to:m.t,p:m.p}),sel=null,render()):ap(m);
  if(ms[0].p){const pb=$('pb');pb.innerHTML='';for(const x of'qrbn'){const b=document.createElement('button');b.textContent=gl(x);b.onclick=()=>{$('promo').classList.remove('show');go(ms.find(m=>m.p===x))};pb.appendChild(b)}$('promo').classList.add('show')}else go(ms[0]);return}
 const p=S.b[i];sel=(p!=='.'&&isW(p)===(S.t==='w')&&LM.some(m=>m.f===i))?(sel===i?null:i):null;render()}
$('fl').onclick=()=>{flip=!flip;render()};
$('un2').onclick=()=>{if(busy||!hist.length)return;do{S=hist.pop().s}while(mode==='bot'&&hist.length&&S.t!==H);sel=null;done=false;update()};
$('nw').onclick=()=>newBot(mode==='local'?'w':hs);
$('rs').onclick=()=>{if(!done&&confirm('Terk ediyor musun?'))tx({a:'resign'})};
$('dr').onclick=()=>{if(!done){tx({a:'draw'});toast('Beraberlik teklif edildi')}};
$('mn').onclick=()=>{if(mode==='online'&&!done&&!confirm('Maç sürüyor, menüye dönersen saat işlemeye devam eder. Dön?'))return;gid++;show('home')};
/* menü */
$('tcs').innerHTML=TCL.map(([t,n])=>`<button data-tc="${t}" class="${t===tc?'on':''}">${t}<small>${n}</small></button>`).join('');
document.querySelectorAll('#tcs button').forEach(b=>b.onclick=()=>{tc=b.dataset.tc;document.querySelectorAll('#tcs button').forEach(x=>x.classList.toggle('on',x===b))});
document.querySelectorAll('.tabs[data-x],.top+.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.top+.tabs button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.pane').forEach(p=>p.style.display=p.id==='p-'+tab?'':'none');$('tc-wrap').style.display=tab==='bot'?'none':''});
$('quick').onclick=()=>{tx({a:'seek',tc});toast('Rakip aranıyor… ('+tc+')')};$('mkch').onclick=()=>tx({a:'seek',tc});
$('mkroom').onclick=()=>tx({a:'room',tc});$('jb').onclick=()=>tx({a:'join',c:$('jc').value});
$('bots').innerHTML=BN.map((b,i)=>`<div class="card${i===1?' on':''}" data-i="${i}"><div class="av">${b[2]}</div><div><b>${b[0]}</b><small>${b[1]}</small></div></div>`).join('');
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{hb=+c.dataset.i;document.querySelectorAll('.card').forEach(x=>x.classList.toggle('on',x===c))});

$('gobot').onclick=()=>{lvl=hb;newBot(hs)};$('gol').onclick=()=>{lvl=-1;newBot('w')};
conn();
